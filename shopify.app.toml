# App pública de producción (CT-08). client_id se completa tras crear la
# app "Puntos de Recogida" en el Partners Dashboard (T001, DEC-18); hasta
# entonces `shopify app deploy --config shopify.app.toml` no puede usarse.
# `shopify app dev` NUNCA debe apuntar a esta configuración: usa
# shopify.app.dev.toml (DEC-18).
client_id = "PENDIENTE_CLIENT_ID_PRODUCCION"
name = "Puntos de Recogida"
application_url = "https://PENDIENTE-url-del-backend.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
# Únicos scopes imprescindibles (FR-069, DEC-23): activar las Functions y
# configurar el App Proxy. Los metaobjetos app-owned no requieren scopes
# desde la API 2026-04.
scopes = "write_delivery_customizations,write_app_proxy"

[auth]
redirect_urls = [ "https://PENDIENTE-url-del-backend.example.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "puntos-recogida"

# La definición [metaobjects.app.punto_recogida] completa (CT-01) se agrega
# en la Fase 3 (US-1, T040) junto con sus 6 campos y validaciones.
