# App pública de producción (CT-08). client_id se completa tras crear la
# app "Puntos de Recogida" en el Partners Dashboard (T001, DEC-18); hasta
# entonces `shopify app deploy --config shopify.app.toml` no puede usarse.
# `shopify app dev` NUNCA debe apuntar a esta configuración: usa
# shopify.app.dev.toml (DEC-18).
client_id = "PENDIENTE_CLIENT_ID_PRODUCCION"
name = "Puntos de Recogida"
application_url = "https://PENDIENTE-url-del-backend.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[access_scopes]
# Únicos scopes imprescindibles (FR-069, DEC-23): activar las Functions y
# configurar el App Proxy. Los metaobjetos app-owned no requieren scopes
# desde la API 2026-04.
scopes = "write_delivery_customizations,write_app_proxy"

[auth]
redirect_urls = [ "https://PENDIENTE-url-del-backend.example.com/auth/callback" ]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "puntos-recogida"

[metaobjects.app.punto_recogida]
name = "Punto de recogida"
description = "Puntos donde los clientes recogen los pedidos de tipo resolado"
display_name_field = "nombre"

[metaobjects.app.punto_recogida.access]
admin = "merchant_read_write"
storefront = "none"

[metaobjects.app.punto_recogida.fields.identificador]
name = "Identificador"
type = "single_line_text_field"
required = true
validations.max = 40
validations.regex = "^[A-Za-z0-9_-]+$"

[metaobjects.app.punto_recogida.fields.nombre]
name = "Nombre"
type = "single_line_text_field"
required = true
validations.max = 100

[metaobjects.app.punto_recogida.fields.direccion]
name = "Dirección"
type = "single_line_text_field"
required = true
validations.max = 255

[metaobjects.app.punto_recogida.fields.direccion_corta]
name = "Dirección formato reducido"
type = "single_line_text_field"
required = true
validations.max = 60

[metaobjects.app.punto_recogida.fields.lat]
name = "Latitud"
type = "number_decimal"
required = true
validations.min = -90.0
validations.max = 90.0

[metaobjects.app.punto_recogida.fields.lng]
name = "Longitud"
type = "number_decimal"
required = true
validations.min = -180.0
validations.max = 180.0
